<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A1D26" />
      <stop offset="60%" stop-color="#101217" />
      <stop offset="100%" stop-color="#08090C" />
    </radialGradient>

    <!-- Glowing Amber & Rust Gradients -->
    <linearGradient id="amberRust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="40%" stop-color="#FF7A33" />
      <stop offset="75%" stop-color="#D94025" />
      <stop offset="100%" stop-color="#9E2A18" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E28743" />
      <stop offset="50%" stop-color="#F7C06D" />
      <stop offset="100%" stop-color="#FFECCC" />
    </linearGradient>

    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3342" />
      <stop offset="100%" stop-color="#181B22" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Slate Backdrop with Rounded Corner Frame -->
  <rect width="800" height="800" rx="96" fill="url(#bgGrad)" stroke="#262B38" stroke-width="3" />

  <!-- Background Ambient Glow Behind Core -->
  <circle cx="400" cy="360" r="180" fill="#FF7A33" opacity="0.12" filter="url(#coreGlow)" />
  <circle cx="400" cy="360" r="90" fill="#FFB347" opacity="0.15" filter="url(#coreGlow)" />

  <!-- Outer Isometric Gear / Diamond Hexagon (Rust Mechanical Shield) -->
  <g transform="translate(400, 360)">
    <!-- External Architectural Frame -->
    <polygon points="0,-230 199,-115 199,115 0,230 -199,115 -199,-115"
             fill="none" stroke="url(#darkMetal)" stroke-width="8" stroke-linejoin="round" opacity="0.6"/>

    <!-- Subtle Matrix Coordinate Grid Lines -->
    <line x1="-120" y1="-170" x2="120" y2="-170" stroke="#FF7A33" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.3"/>
    <line x1="-160" y1="-100" x2="160" y2="-100" stroke="#FF7A33" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.3"/>
    <line x1="-160" y1="100" x2="160" y2="100" stroke="#FF7A33" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.3"/>
    <line x1="-120" y1="170" x2="120" y2="170" stroke="#FF7A33" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.3"/>

    <!-- Causal Hourglass & Dune Facets (The Sand + Attention Nexus) -->
    <!-- Upper Chamber: Context Compression Planes -->
    <path d="M -150,-150 L 150,-150 L 0,-10 Z"
          fill="url(#amberRust)" fill-opacity="0.18" stroke="url(#amberRust)" stroke-width="6" stroke-linejoin="round"/>
    
    <path d="M -150,-150 L 0,-150 L 0,-10 Z"
          fill="url(#goldLight)" fill-opacity="0.25" />

    <!-- 4 Tiered Attention Layers in Upper Basin -->
    <line x1="-110" y1="-115" x2="110" y2="-115" stroke="url(#goldLight)" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="-75" y1="-80" x2="75" y2="-80" stroke="url(#goldLight)" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="-40" y1="-45" x2="40" y2="-45" stroke="url(#goldLight)" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Central Attention Bottleneck (Dynamic Focus Point) -->
    <circle cx="0" cy="-10" r="12" fill="#FFECCC" filter="url(#subtleGlow)"/>
    <circle cx="0" cy="-10" r="6" fill="#FFFFFF" />

    <!-- Lower Chamber: Generative Dune Accumulation -->
    <path d="M 0,-10 L 150,150 L -150,150 Z"
          fill="url(#amberRust)" fill-opacity="0.22" stroke="url(#amberRust)" stroke-width="6" stroke-linejoin="round"/>
    
    <path d="M 0,-10 L 0,150 L 150,150 Z"
          fill="#D94025" fill-opacity="0.3" />

    <!-- Cascading Sand Token Nodes (Discrete Autoregressive Generation) -->
    <circle cx="0" cy="22" r="5" fill="#FFECCC" filter="url(#subtleGlow)"/>
    <circle cx="0" cy="46" r="6" fill="#F7C06D" />
    <circle cx="-22" cy="74" r="5.5" fill="#FF7A33" />
    <circle cx="22" cy="74" r="5.5" fill="#FFB347" />
    <circle cx="-50" cy="108" r="6" fill="#D94025" />
    <circle cx="0" cy="106" r="6.5" fill="#F7C06D" />
    <circle cx="50" cy="108" r="6" fill="#D94025" />
    
    <!-- Foundation Base Tokens -->
    <circle cx="-85" cy="138" r="5" fill="#9E2A18" />
    <circle cx="-42" cy="138" r="6" fill="#FF7A33" />
    <circle cx="0" cy="138" r="7" fill="#FFECCC" />
    <circle cx="42" cy="138" r="6" fill="#FF7A33" />
    <circle cx="85" cy="138" r="5" fill="#9E2A18" />

    <!-- Stylized Sand Dune Wave Crest (Sweeping S-Curve Overlay) -->
    <path d="M -165,-60 C -120,-10 -60,40 0,-10 C 60,-60 120,-10 165,40"
          fill="none" stroke="url(#goldLight)" stroke-width="4.5" stroke-linecap="round" opacity="0.85" filter="url(#subtleGlow)"/>
  </g>

  <!-- Typography Brandmark -->
  <text x="400" y="660" 
        font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', Roboto, sans-serif" 
        font-weight="900" 
        font-size="46" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="10">SANDYRUST</text>

  <!-- Monospaced Subtitle -->
  <text x="400" y="700" 
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" 
        font-weight="600" 
        font-size="14" 
        fill="#FF7A33" 
        text-anchor="middle" 
        letter-spacing="5">PURE RUST TRANSFORMER ENGINE</text>
  
  <text x="400" y="725" 
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" 
        font-weight="500" 
        font-size="11" 
        fill="#6E7687" 
        text-anchor="middle" 
        letter-spacing="2">0 CRATES • #![forbid(unsafe_code)] • 31/31 GATES</text>
</svg>

