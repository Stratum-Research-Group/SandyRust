<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="monoBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#181B22" />
      <stop offset="60%" stop-color="#0E1014" />
      <stop offset="100%" stop-color="#07080A" />
    </radialGradient>

    <!-- Monotone Titanium / Platinum Gradients -->
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB" />
      <stop offset="30%" stop-color="#9CA3AF" />
      <stop offset="70%" stop-color="#4B5563" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>

    <linearGradient id="silverRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="50%" stop-color="#D1D5DB" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="slateAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9CA3AF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1F2937" stop-opacity="0.05" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Slate/Carbon Canvas -->
  <rect width="800" height="800" rx="96" fill="url(#monoBg)" stroke="#222631" stroke-width="2.5" />

  <!-- Ambient Backdrop Aura -->
  <circle cx="400" cy="355" r="170" fill="#9CA3AF" opacity="0.06" filter="url(#softGlow)" />

  <g transform="translate(400, 355)">
    <!-- Architectural Outer Ring (Subtle Coordinate Guide) -->
    <circle cx="0" cy="0" r="190" fill="none" stroke="#252A36" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.6"/>
    
    <!-- Concentric Attention Ray Cross-Section -->
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#374151" stroke-width="1" stroke-dasharray="4,6" opacity="0.4"/>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#374151" stroke-width="1" stroke-dasharray="4,6" opacity="0.4"/>

    <!-- Dynamic Dune Infinity / Möbius Ribbon: Upper Loop -->
    <path d="M 0,-15 C -65,-75 -135,-95 -135,-35 C -135,35 -50,65 0,-15 C 50,-95 135,-65 135,5 C 135,65 65,45 0,-15"
          fill="url(#slateAccent)" stroke="url(#titaniumGrad)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Outer Precision Chamfer / Rim Highlight -->
    <path d="M 0,-15 C -65,-75 -135,-95 -135,-35 C -135,35 -50,65 0,-15"
          fill="none" stroke="url(#silverRim)" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#softGlow)"/>

    <path d="M 0,-15 C 50,-95 135,-65 135,5 C 135,65 65,45 0,-15"
          fill="none" stroke="url(#silverRim)" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#softGlow)"/>

    <!-- Sweeping Dune Crest Ridge Line -->
    <path d="M -140,-35 C -100,5 -30,-40 0,-15 C 30,10 100,-35 140,5"
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

    <!-- Multi-Head Attention Dot Nodes (Platinum & Silver) -->
    <!-- Center Causal Nexus -->
    <circle cx="0" cy="-15" r="9" fill="#FFFFFF" filter="url(#softGlow)"/>
    <circle cx="0" cy="-15" r="4.5" fill="#111317"/>

    <!-- Left Orbital Nodes -->
    <circle cx="-135" cy="-35" r="6" fill="#E5E7EB"/>
    <circle cx="-95" cy="-75" r="4.5" fill="#9CA3AF"/>
    <circle cx="-55" cy="40" r="4.5" fill="#6B7280"/>

    <!-- Right Orbital Nodes -->
    <circle cx="135" cy="5" r="6" fill="#E5E7EB"/>
    <circle cx="95" cy="-60" r="4.5" fill="#9CA3AF"/>
    <circle cx="55" cy="35" r="4.5" fill="#6B7280"/>
  </g>

  <!-- Monotone Typography -->
  <text x="400" y="655" 
        font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', Roboto, sans-serif" 
        font-weight="900" 
        font-size="46" 
        fill="#F9FAFB" 
        text-anchor="middle" 
        letter-spacing="10">SANDYRUST</text>

  <text x="400" y="698" 
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" 
        font-weight="600" 
        font-size="13" 
        fill="#9CA3AF" 
        text-anchor="middle" 
        letter-spacing="5">PURE-RUST TRANSFORMER ENGINE</text>

  <text x="400" y="726" 
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" 
        font-weight="500" 
        font-size="11" 
        fill="#4B5563" 
        text-anchor="middle" 
        letter-spacing="2">0 CRATES • #![forbid(unsafe_code)] • 31/31 GATES</text>
</svg>

