stages:
  - lint
  - test
  - verify

default:
  image: rust:1.82-slim
  before_script:
    - rustc --version
    - cargo --version

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cargo/
    - target/

lint:
  stage: lint
  before_script:
    - rustc --version
    - cargo --version
    - rustup component add clippy
  script:
    - cargo clippy --all-targets --locked -- -D warnings

test:
  stage: test
  script:
    - cargo test --release --locked

verify:
  stage: verify
  script:
    - cargo run --release -- verify
